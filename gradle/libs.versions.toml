[versions]
agp = "9.3.0"
kotlin = "2.2.10"
coreKtx = "1.19.0"
coroutines = "1.11.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
media3 = "1.10.1"
exifinterface = "1.4.2"
junit = "6.1.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
robolectric = "4.16.1"

[libraries]
# Core Android + coroutines
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# viewModel() inside a Composable. Same lifecycle version train as the runtime artifact
# above; AndroidX/Apache 2.0, so no F-Droid concern and no Play Services pulled in.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Compose (library versions are supplied by the BOM below)
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Media3 — frame extraction from the embedded clip.
# FrameExtractor has moved modules three times (transformer -> inspector ->
# inspector-frame). Verified against the 1.10.1 sources on 2026-07-20:
# androidx.media3.inspector.frame.FrameExtractor lives in media3-inspector-frame.
# Note media3-inspector still exists at 1.10.1 but no longer holds FrameExtractor,
# so depending on that one resolves in Gradle and fails only at the import.
androidx-media3-inspector-frame = { group = "androidx.media3", name = "media3-inspector-frame", version.ref = "media3" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# EXIF read/write on the extracted frame. Used for writing metadata onto the output
# only — the Container directory is :core-motionphoto's job, because ExifInterface
# deliberately prefers Exif tag 700 over a separate XMP segment on JPEG (a documented
# backward-compatibility quirk that HEIC and PNG were fixed for and JPEG was not).
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# Testing — JUnit 6 (Jupiter) for local/JVM unit tests
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
# Instrumented tests (androidTest) still run on the JUnit 4-based AndroidX runner.
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Robolectric — Android unit tests on the JVM, for :app only. The three core- modules take
# bytes and Files by design, so they need none of this.
#
# MIT licensed rather than Apache 2.0 like everything else here. It is test-only, so it
# never reaches the APK and raises no F-Droid question — recorded because CLAUDE.md asks
# for a dependency's license to be a decision rather than an accident.
#
# 4.16.1 ships no android-all runtime for SDK 37, so tests simulate 36 while the project
# still compiles against 37 — set once in app/src/test/resources/robolectric.properties,
# which explains why lowering compileSdk was not an option.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Robolectric's runner is JUnit 4; this project is JUnit 6 Jupiter throughout. Vintage runs
# JUnit 4 classes on the JUnit Platform alongside Jupiter, so one ./gradlew test drives both
# engines and no existing test had to change. A downgrade was the alternative and would have
# meant rewriting 50 tests, including the DynamicTest factories that let the samples/ tiers
# skip cleanly. Deprecated in JUnit 6 but explicitly not slated for removal.
# No version.ref: it comes from junit-bom, so it cannot drift from the Jupiter artifacts.
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
