# The Android SDK Robolectric simulates for every test in this source set.
#
# 36, not the project's compileSdk of 37: Robolectric 4.16.1 ships no android-all runtime
# for 37 and refuses to boot against one it does not have. Setting it here rather than with
# @Config(sdk = [36]) on each class means a new test cannot forget it — the failure mode
# otherwise is a class that runs everywhere except this project's next SDK bump.
#
# Lowering the project to compileSdk 36 was tried first and is not available: androidx
# core-ktx 1.19.0 and lifecycle-viewmodel-compose 2.11.0 both require compiling against 37
# or later, so the app would have to give up its AndroidX versions to gain a matching test
# runtime. Simulating one SDK below the compile target is the cheaper asymmetry, and it only
# affects tests.
#
# Revisit when Robolectric adds SDK 37: deleting this file is then the whole change.
sdk=36
